spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:niraj.jayswal@knowvasystems.com}
    password: ${SMTP_PASSWORD:SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
  application:
    name: admissionservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/datasource}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    enabled: false
  jpa:
    hibernate:
      # update keeps existing rows (seed data in db/seed/module02_admission_seed.sql survives restarts)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8083}
  servlet:
    # All endpoints are served under http://localhost:8083/admissionservice (e.g. /admissionservice/api/v1/admissions/enquiries)
    context-path: ${SERVER_CONTEXT_PATH:/admissionservice}

admission:
  # US-02004: applicant document vault (PDF/JPEG/PNG, max 5 MB)
  document-vault:
    base-path: ${DOCUMENT_VAULT_PATH:./document-vault}
    max-file-size-bytes: 5242880
  # US-02006: base URL of the online fee payment page embedded in offer letters
  payment:
    link-base-url: ${PAYMENT_LINK_BASE_URL:https://pay.kvs.local/admissions/offers}
  # US-02009: automatic WhatsApp reminders for upcoming entrance evaluations
  reminders:
    auto-dispatch:
      enabled: ${REMINDER_AUTO_DISPATCH_ENABLED:false}
      cron: "0 0 * * * *"
      lookahead-hours: 24
  # US-02014: daily automatic waitlist escalation for grades whose rule enables it
  waitlist:
    auto-escalation:
      enabled: ${WAITLIST_AUTO_ESCALATION_ENABLED:false}
      cron: "0 30 6 * * *"

kvs:
  # Shared WhatsApp/email provider settings (ms-core com.kvs.core.notification). LOG = log only, no message is sent.
  notification:
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:LOG}
      access-token: ${WHATSAPP_ACCESS_TOKEN:REPLACE_WITH_WHATSAPP_ACCESS_TOKEN}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:REPLACE_WITH_PHONE_NUMBER_ID}
      api-version: ${WHATSAPP_API_VERSION:v20.0}
      template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
    email:
      provider: ${EMAIL_PROVIDER:LOG}
      from: ${EMAIL_FROM:REPLACE_WITH_SENDER_EMAIL}

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: ${JWT_EXPIRATION:1800000}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      consume: [w3c, b3]
      produce: [w3c, b3]

logging:
  level:
    root: info
    com.kvs: debug
    com.kvs.core.logging.RequestAndRepositoryLoggingAspect: debug
    org.springframework.security: debug
