spring:
  application:
    name: admissionservice-test
  datasource:
    url: jdbc:h2:mem:admissiontestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: -1

kvs:
  # Tests have no authservice: permissions come from the catalogue's defaults (ms-core rbac/permissions.json)
  rbac:
    resolver: static
  access-rules:
    path: /api/v1/admissions/access-rules
    base-package: com.kvs.admission

logging:
  level:
    root: warn
